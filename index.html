<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>RAG Eval Kit</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:system-ui;background:#0d1117;color:#e6edf3;max-width:720px;margin:auto;padding:2rem}h1{color:#58a6ff}a{color:#58a6ff}input{padding:.5rem;width:110px}button{background:#1f6feb;color:#fff;border:0;padding:.6rem 1rem;border-radius:8px}#out{margin-top:1rem;background:#161b22;padding:1rem;border-radius:8px;white-space:pre-wrap}</style></head><body><h1>📏 RAG Eval Kit</h1><p>Quick health check of your RAG pipeline.</p><label>Retrieval hit rate (%): <input id="r" type="number" value="72"></label> <label>Groundedness (%): <input id="g" type="number" value="85"></label> <label>P95 latency (ms): <input id="l" type="number" value="1800"></label> <button onclick="go()">Evaluate</button><div id="out"></div><script>function go(){const e=id=>+document.getElementById(id).value;const r=e('r'),g=e('g'),l=e('l');let tips=[];if(r<80)tips.push('Improve chunking/embedding model (hit rate low)');if(g<90)tips.push('Add reranker + stricter grounding prompts');if(l>2000)tips.push('Cache frequent queries; reduce top-k');const sc=Math.round(r*0.4+g*0.4+Math.max(0,100-l/30)*0.2);document.getElementById('out').textContent=`RAG health score: ${Math.min(100,sc)}/100\n\nFindings:\n${tips.length?tips.map(t=>'• '+t).join('\n'):'• Pipeline looks healthy!'}\n\nFull eval harness with golden datasets: commercial@ziontechgroup.com`}</script><p><a href="https://ziontechgroup.com/apps/">← Zion App Network</a> · <a href="https://github.com/Zion-support/zion-rag-eval-kit">GitHub</a> · <a href="https://ziontechgroup.com/rag-forge/">RAG Forge</a></p></body></html>
